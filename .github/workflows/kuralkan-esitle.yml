name: Kuralkan'a eşitle

# rdr'deki veriyi ve yayınlanmış sayfaları Kuralkan deposuna iter:
#   github.com/Kuralkan-Bilisim-Otomotiv/bayi_servisler (gizli)
#   kuralkan-bilisim-otomotiv.github.io/bayi_servisler/        canlı
#   kuralkan-bilisim-otomotiv.github.io/bayi_servisler/onizleme/
#
# NEDEN: Kuralkan organizasyonunda Actions işleri ödeme/harcama limiti
# nedeniyle başlamıyor (17 Kasım 2026'dan beri her iş "not started").
# Pages orada daldan (main, kök) yayın yaptığı için Actions'a ihtiyaç
# duymuyor. Tarama ve yayın burada (rdr) çalışıyor, sonuç oraya itiliyor.
#
# Tarama/yayın/canlıya alma akışları bitince ve canlı/önizleme sayfası
# elle değişince çalışır. Yalnızca veri ve sayfa dosyalarını taşır, kod
# taşımaz. Kuralkan'da canlı = index.html (canli/index.html kopyası).
#
# GEREKEN SIR: KURALKAN_TOKEN — Kuralkan deposuna yazma yetkili token
# (Settings → Secrets and variables → Actions). Yoksa akış uyarı verip
# hiçbir şey yapmadan biter.

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Bayileri tara ve siteyi yayınla"
      - "Marka marka tara (teşhis)"
      - "Sadece siteyi yayınla"
      - "Önizlemeyi canlıya al"
    types: [completed]
  push:
    branches: [main]
    paths: ["index.html", "onizleme/index.html", "canli/index.html", "bayiler.db"]

permissions:
  contents: read

concurrency:
  group: kuralkan-esitle
  cancel-in-progress: false

jobs:
  esitle:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sır var mı
        id: sir
        env:
          T: ${{ secrets.KURALKAN_TOKEN }}
        run: |
          if [ -z "$T" ]; then
            echo "::warning::KURALKAN_TOKEN tanımlı değil — Kuralkan deposuna eşitleme yapılmadı"
            echo "var=hayir" >> "$GITHUB_OUTPUT"
          else
            echo "var=evet" >> "$GITHUB_OUTPUT"
          fi

      # workflow_run olayında varsayılan checkout tetikleyen işin commit'ini
      # alıyor; o akış sonucu sonradan push'ladığı için EN SON main lazım.
      - uses: actions/checkout@v4
        if: steps.sir.outputs.var == 'evet'
        with: { ref: main, path: rdr }

      - name: Kuralkan deposuna yaz
        if: steps.sir.outputs.var == 'evet'
        env:
          T: ${{ secrets.KURALKAN_TOKEN }}
        run: |
          git clone -q --depth 1 \
            "https://x-access-token:${T}@github.com/Kuralkan-Bilisim-Otomotiv/bayi_servisler.git" ks
          cd ks
          git config user.name  "bayi-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          DOSYALAR="bayiler.db bayiler_yeni.db cari_kodlar.json canli/index.html index.html onizleme/index.html onizleme.html"
          for f in $DOSYALAR; do
            if [ -f "../rdr/$f" ]; then
              mkdir -p "$(dirname "$f")"
              cp "../rdr/$f" "$f"
            fi
          done
          # Canlı sayfa boş/bozuk gitmesin
          grep -q "const D =" index.html || { echo "::error::index.html bozuk, eşitleme yapılmadı"; exit 1; }
          git add -f $DOSYALAR
          git diff --staged --quiet && { echo "Değişiklik yok"; exit 0; }
          git commit -q -m "rdr'den eşitlendi: $(date -u +'%Y-%m-%d %H:%M UTC') (rdr $(git -C ../rdr rev-parse --short HEAD))"
          for i in 1 2 3 4 5; do
            git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && { echo "eşitlendi"; exit 0; }
            sleep 10
          done
          echo "::error::Kuralkan deposuna yazılamadı"
          exit 1
